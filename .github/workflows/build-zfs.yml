name: Build Debian ZFS Prebuilt Modules

on:
  workflow_dispatch:
    inputs:
      backfill_history:
        description: '同时从 snapshot.debian.org 回填 Debian 12+ 历史内核'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

# 说明：
# 1. 仅覆盖 Debian 官方 x86_64 内核：amd64 / cloud-amd64 / rt-amd64。
# 2. 不包含 Proxmox VE 的 *-pve 内核；PVE 应单独建立 workflow。
# 3. Debian 构建环境通过 docker run 启动，而不是 GitHub Actions 的 job.container。
#    这样 GitHub 的 Node 24 Actions 始终运行在 ubuntu-latest 宿主机，避免 Debian 12
#    容器内出现 /__e/node24/bin/node: no such file or directory。
# 4. Snapshot 下载全部使用 Python urllib，不再依赖 Python subprocess 调 curl。

jobs:
  # ============================================================================
  # Job 1: 当前仓库全量扫描
  # ============================================================================
  current-debian:
    name: "Debian ${{ matrix.debian }} current/all flavors"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - debian: '12'
            image: bookworm
            suite: bookworm
            backports: bookworm-backports
          - debian: '13'
            image: trixie
            suite: trixie
            backports: trixie-backports
          - debian: '14'
            image: forky
            suite: forky
            backports: ''

    steps:
      - name: 在 Debian 容器中扫描、编译、打包当前内核
        env:
          DEBIAN_VER: ${{ matrix.debian }}
          IMAGE: ${{ matrix.image }}
          SUITE: ${{ matrix.suite }}
          BACKPORTS: ${{ matrix.backports }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/output"
          mkdir -p "$GITHUB_WORKSPACE/output"

          docker pull "debian:${IMAGE}"
          docker run --rm --privileged \
            -e DEBIAN_VER="$DEBIAN_VER" \
            -e SUITE="$SUITE" \
            -e BACKPORTS="$BACKPORTS" \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "debian:${IMAGE}" bash -s <<'CONTAINER'
          set -euxo pipefail

          if [ "$DEBIAN_VER" = "12" ]; then
            cat > /etc/apt/sources.list <<EOF
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-backports main contrib non-free non-free-firmware
          EOF
            rm -f /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          elif [ "$DEBIAN_VER" = "13" ]; then
            cat > /etc/apt/sources.list <<EOF
          deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware
          EOF
            rm -f /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          else
            cat > /etc/apt/sources.list <<EOF
          deb http://deb.debian.org/debian forky main contrib non-free non-free-firmware
          EOF
            rm -f /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          fi

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential dkms git bash curl ca-certificates tar gzip sed gawk bc \
            python3 file xz-utils kmod

          if [ "$DEBIAN_VER" = "12" ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              -t bookworm-backports zfs-dkms
          else
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zfs-dkms
          fi

          chmod -x /etc/kernel/header_postinst.d/dkms 2>/dev/null || true
          mkdir -p output

          ZFS_VER=$(find /usr/src -maxdepth 1 -type d -name 'zfs-*' -printf '%f\n' 2>/dev/null | sed 's/^zfs-//' | sort -V | tail -n1)
          if [ -z "$ZFS_VER" ]; then
            echo "错误：未找到 /usr/src/zfs-*"
            exit 1
          fi
          echo "====> ZFS DKMS: ${ZFS_VER} <===="

          mapfile -t KERNELS < <(
            apt-cache --names-only search '^linux-headers-[0-9]' \
              | awk '{print $1}' \
              | sed 's/^linux-headers-//' \
              | grep -E '^[0-9]+\.[0-9]+.*-(amd64|cloud-amd64|rt-amd64)$' \
              | grep -v -E '^[0-9]+\.[0-9]+-(amd64|cloud-amd64|rt-amd64)$' \
              | sort -uV
          )

          echo "发现 ${#KERNELS[@]} 个当前 APT 可见的 Debian x86_64 内核："
          printf '  %s\n' "${KERNELS[@]}"

          for kver in "${KERNELS[@]}"; do
            echo
            echo "============================================================"
            echo ">>> ${kver}"

            ASSET="zfs-modules-${kver}.tar.gz"
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/debian-ZFS/${ASSET}"

            if curl --http1.1 -sSfL -I "$URL" >/dev/null 2>&1; then
              echo "✓ Release 已存在，跳过"
              continue
            fi

            if ! DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "linux-headers-${kver}"; then
              echo "[-] headers 安装失败：${kver}"
              dpkg --configure -a || true
              apt-get -f install -y || true
              apt-get purge -y "linux-headers-${kver}" >/dev/null 2>&1 || true
              continue
            fi

            dkms remove "zfs/${ZFS_VER}" -k "$kver" >/dev/null 2>&1 || true
            if ! dkms build "zfs/${ZFS_VER}" -k "$kver"; then
              echo "[-] ZFS 编译失败：${kver}"
              LOG="/var/lib/dkms/zfs/${ZFS_VER}/build/make.log"
              [ -f "$LOG" ] && tail -n 80 "$LOG" || true
              apt-get purge -y "linux-headers-${kver}" >/dev/null 2>&1 || true
              rm -rf "/var/lib/dkms/zfs/${ZFS_VER}/${kver}" || true
              continue
            fi

            MOD_DIR=$(find "/lib/modules/${kver}" "/var/lib/dkms/zfs/${ZFS_VER}/${kver}" \
              -type f -name 'zfs.ko*' -print 2>/dev/null | head -n1 | xargs -r dirname)
            if [ -z "$MOD_DIR" ] || [ ! -d "$MOD_DIR" ]; then
              echo "[-] 未找到 zfs.ko：${kver}"
              continue
            fi

            PKG_ROOT="/tmp/zfs-pack-${kver}"
            PKG_DIR="${PKG_ROOT}/zfs-modules-${kver}"
            rm -rf "$PKG_ROOT"
            mkdir -p "${PKG_DIR}/modules"
            find "$MOD_DIR" -type f -name '*.ko*' -exec cp -f {} "${PKG_DIR}/modules/" \;

            cat > "${PKG_DIR}/metadata.txt" <<EOF
          kernel_version=${kver}
          module_path=updates/dkms
          zfs_version=${ZFS_VER}
          debian_version=${DEBIAN_VER}
          EOF

            tar -czf "output/${ASSET}" -C "$PKG_ROOT" "zfs-modules-${kver}"
            echo "✓ 生成 output/${ASSET}"

            apt-get purge -y "linux-headers-${kver}" >/dev/null 2>&1 || true
            rm -rf "$PKG_ROOT" "/var/lib/dkms/zfs/${ZFS_VER}/${kver}" || true
          done
          CONTAINER

      - name: 上传当前内核到 Release
        uses: softprops/action-gh-release@v3
        if: always()
        with:
          tag_name: debian-ZFS
          name: Debian ZFS Prebuilt Modules
          files: output/zfs-modules-*.tar.gz
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Job 2: 手动历史发现
  # ============================================================================
  discover-history:
    name: "Discover Debian ${{ matrix.debian }} historical kernels"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_history == true }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13', '14']

    steps:
      - name: 从 snapshot.debian.org 生成历史内核清单
        env:
          TARGET_DEBIAN: ${{ matrix.debian }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.parse
          import urllib.request

          target = os.environ['TARGET_DEBIAN']
          api = 'https://snapshot.debian.org/mr'
          ua = {'User-Agent': 'my-debian-zfs/2.1 (+GitHub Actions)'}

          def get_json(url, retries=8):
              last = None
              for n in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=ua)
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return json.load(r)
                  except Exception as e:
                      last = e
                      time.sleep(min(2 ** n, 20))
              raise RuntimeError(f'GET failed: {url}: {last}')

          def ver_tuple(v):
              m = re.match(r'^(\d+)\.(\d+)(?:\.(\d+))?', v)
              if not m:
                  return None
              return tuple(int(x or 0) for x in m.groups())

          def source_maybe_relevant(v):
              t = ver_tuple(v)
              if not t or t < (6, 1, 0):
                  return False
              major, minor, _ = t
              if target == '12':
                  return (major, minor) == (6, 1) or '~bpo12' in v
              if target == '13':
                  return (major, minor) == (6, 12) or '~bpo13' in v
              return t >= (6, 12, 0)

          def belongs(kver):
              if target == '12':
                  m = re.match(r'^6\.1\.0-(\d+)-(?:amd64|cloud-amd64|rt-amd64)$', kver)
                  if m:
                      # Debian 12 正式发布从 ABI 9 开始；1~8 不回填。
                      return int(m.group(1)) >= 9
                  return 'deb12' in kver
              if target == '13':
                  return 'deb13' in kver
              return 'deb14' in kver

          def newer(a, b):
              return subprocess.run(['dpkg', '--compare-versions', a, 'gt', b]).returncode == 0

          print('读取 Snapshot 的 linux 源码版本索引...')
          versions = [x['version'] for x in get_json(f'{api}/package/linux/')['result']]
          versions = [v for v in versions if source_maybe_relevant(v)]
          print(f'候选源码版本数: {len(versions)}')

          found = {}
          for idx, srcver in enumerate(versions, 1):
              qver = urllib.parse.quote(srcver, safe='')
              try:
                  data = get_json(f'{api}/package/linux/{qver}/binpackages')
              except Exception as e:
                  print(f'[warn] {srcver}: {e}')
                  continue

              for item in data.get('result', []):
                  name = item.get('name', '')
                  m = re.match(r'^linux-headers-(.+-(?:amd64|cloud-amd64|rt-amd64))$', name)
                  if not m:
                      continue
                  kver = m.group(1)
                  if not belongs(kver):
                      continue
                  binver = item.get('version', '')
                  old = found.get(kver)
                  if old is None or (binver and newer(binver, old['binver'])):
                      found[kver] = {'kver': kver, 'binver': binver, 'srcver': srcver}

              if idx % 25 == 0:
                  print(f'已扫描 {idx}/{len(versions)}，发现 {len(found)} 个内核')
              time.sleep(0.08)

          rows = sorted(found.values(), key=lambda x: x['kver'])
          out = f'kernels-{target}.json'
          with open(out, 'w') as f:
              json.dump(rows, f, ensure_ascii=False, indent=2)

          print(f'\nDebian {target}: 共发现 {len(rows)} 个历史/当前内核')
          for x in rows:
              print(x['kver'], '|', x['binver'], '|', x['srcver'])
          PY

      - name: 上传历史清单 Artifact
        uses: actions/upload-artifact@v6
        with:
          name: kernels-${{ matrix.debian }}
          path: kernels-${{ matrix.debian }}.json
          retention-days: 1

  # ============================================================================
  # Job 3: Snapshot 历史回填
  # ============================================================================
  backfill-history:
    name: "Backfill Debian ${{ matrix.debian }} / ${{ matrix.flavor }}"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_history == true }}
    needs: discover-history
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - debian: '12'
            image: bookworm
            flavor: amd64
          - debian: '12'
            image: bookworm
            flavor: cloud-amd64
          - debian: '12'
            image: bookworm
            flavor: rt-amd64
          - debian: '13'
            image: trixie
            flavor: amd64
          - debian: '13'
            image: trixie
            flavor: cloud-amd64
          - debian: '13'
            image: trixie
            flavor: rt-amd64
          - debian: '14'
            image: forky
            flavor: amd64
          - debian: '14'
            image: forky
            flavor: cloud-amd64
          - debian: '14'
            image: forky
            flavor: rt-amd64

    steps:
      - name: 下载历史内核清单
        uses: actions/download-artifact@v7
        with:
          name: kernels-${{ matrix.debian }}
          path: kernel-list

      - name: 在 Debian 容器中从 Snapshot 回填缺失模块
        env:
          TARGET_DEBIAN: ${{ matrix.debian }}
          TARGET_FLAVOR: ${{ matrix.flavor }}
          IMAGE: ${{ matrix.image }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/output"
          mkdir -p "$GITHUB_WORKSPACE/output"

          docker pull "debian:${IMAGE}"
          docker run --rm --privileged \
            -e TARGET_DEBIAN="$TARGET_DEBIAN" \
            -e TARGET_FLAVOR="$TARGET_FLAVOR" \
            -e REPO="$REPO" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "debian:${IMAGE}" bash -s <<'CONTAINER'
          set -euxo pipefail

          if [ "$TARGET_DEBIAN" = "12" ]; then
            cat > /etc/apt/sources.list <<EOF
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-backports main contrib non-free non-free-firmware
          EOF
            rm -f /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          elif [ "$TARGET_DEBIAN" = "13" ]; then
            cat > /etc/apt/sources.list <<EOF
          deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware
          EOF
            rm -f /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          else
            cat > /etc/apt/sources.list <<EOF
          deb http://deb.debian.org/debian forky main contrib non-free non-free-firmware
          EOF
            rm -f /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
          fi

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential dkms git bash curl ca-certificates tar gzip sed gawk bc \
            python3 file xz-utils kmod dpkg-dev

          if [ "$TARGET_DEBIAN" = "12" ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              -t bookworm-backports zfs-dkms
          else
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zfs-dkms
          fi

          chmod -x /etc/kernel/header_postinst.d/dkms 2>/dev/null || true
          mkdir -p output /tmp/snapshot-debs

          command -v python3
          command -v dkms
          command -v curl

          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          target = os.environ['TARGET_DEBIAN']
          flavor = os.environ['TARGET_FLAVOR']
          repo = os.environ['REPO']
          manifest = f'/work/kernel-list/kernels-{target}.json'
          api = 'https://snapshot.debian.org/mr'
          ua = {'User-Agent': 'my-debian-zfs/2.1 (+GitHub Actions)'}
          debdir = '/tmp/snapshot-debs'

          def sh(cmd, check=False, capture=False):
              if capture:
                  return subprocess.run(cmd, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=check)
              return subprocess.run(cmd, check=check)

          def get_json(url, retries=8):
              last = None
              for n in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=ua)
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return json.load(r)
                  except Exception as e:
                      last = e
                      time.sleep(min(2 ** n, 20))
              raise RuntimeError(f'GET failed: {url}: {last}')

          def released(kver):
              url = f'https://github.com/{repo}/releases/download/debian-ZFS/zfs-modules-{kver}.tar.gz'
              req = urllib.request.Request(url, headers=ua, method='HEAD')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return 200 <= r.status < 400
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return False
                  print(f'[warn] Release 检查 HTTP {e.code}: {kver}')
                  return False
              except Exception as e:
                  print(f'[warn] Release 检查失败，按不存在处理: {kver}: {e}')
                  return False

          def newest_version(records):
              best = None
              for r in records:
                  v = r.get('binary_version', '')
                  if not v:
                      continue
                  if best is None:
                      best = r
                      continue
                  if sh(['dpkg', '--compare-versions', v, 'gt', best['binary_version']]).returncode == 0:
                      best = r
              return best

          def find_binary_version(pkg, srcver, exact=None):
              qpkg = urllib.parse.quote(pkg, safe='')
              data = get_json(f'{api}/binary/{qpkg}/')
              rows = data.get('result', [])
              if exact:
                  exact_rows = [r for r in rows if r.get('binary_version') == exact]
                  if exact_rows:
                      same = [r for r in exact_rows if r.get('source') == 'linux' and r.get('version') == srcver]
                      best = newest_version(same or exact_rows)
                      return best['binary_version'] if best else None
              same = [r for r in rows if r.get('source') == 'linux' and r.get('version') == srcver]
              if same:
                  best = newest_version(same)
                  return best['binary_version'] if best else None
              return None

          def download_url(url, target_path, retries=8):
              last = None
              tmp = target_path + '.tmp'
              for n in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=ua)
                      with urllib.request.urlopen(req, timeout=240) as r, open(tmp, 'wb') as f:
                          shutil.copyfileobj(r, f, length=1024 * 1024)
                      if os.path.getsize(tmp) < 1024:
                          raise RuntimeError('下载文件过小')
                      os.replace(tmp, target_path)
                      return
                  except Exception as e:
                      last = e
                      try:
                          os.remove(tmp)
                      except FileNotFoundError:
                          pass
                      time.sleep(min(2 ** n, 20))
              raise RuntimeError(f'下载失败: {url}: {last}')

          def download_binary(pkg, binver):
              safe_name = re.sub(r'[^A-Za-z0-9_.+-]+', '_', f'{pkg}_{binver}')
              cached = os.path.join(debdir, safe_name + '.deb')
              if os.path.exists(cached) and os.path.getsize(cached) > 1024:
                  return cached

              qpkg = urllib.parse.quote(pkg, safe='')
              qver = urllib.parse.quote(binver, safe='')
              data = get_json(f'{api}/binary/{qpkg}/{qver}/binfiles?fileinfo=1')
              results = data.get('result', [])
              fileinfo = data.get('fileinfo', {})

              preferred = [x for x in results if x.get('architecture') == 'amd64']
              if not preferred:
                  preferred = [x for x in results if x.get('architecture') == 'all']
              if not preferred:
                  raise RuntimeError(f'没有 amd64/all 文件: {pkg}={binver}')

              h = preferred[0]['hash']
              infos = fileinfo.get(h, [])
              filename = infos[0].get('name') if infos else (safe_name + '.deb')
              url = f'https://snapshot.debian.org/file/{h}/{urllib.parse.quote(filename)}'
              download_url(url, cached)
              return cached

          dep_re = re.compile(r'(?P<pkg>(?:linux-(?:headers|kbuild|base|support)-[A-Za-z0-9.+~-]+))\s*(?:\(\s*=\s*(?P<ver>[^)]+)\))?')
          gcc_re = re.compile(r'\b(gcc-[0-9]+(?:-for-host)?)\b')

          def extract_header_tree(kver, header_binver, srcver):
              root_pkg = f'linux-headers-{kver}'
              queue = [(root_pkg, header_binver)]
              seen = set()
              compilers = set()

              while queue:
                  pkg, binver = queue.pop(0)
                  key = (pkg, binver)
                  if key in seen:
                      continue
                  seen.add(key)

                  deb = download_binary(pkg, binver)
                  meta = sh(['dpkg-deb', '-f', deb, 'Depends'], capture=True)
                  depends = meta.stdout if meta.returncode == 0 else ''
                  compilers.update(gcc_re.findall(depends))

                  # 只解包，不运行旧包 maintainer scripts。
                  sh(['dpkg-deb', '-x', deb, '/'], check=True)

                  for m in dep_re.finditer(depends):
                      dep = m.group('pkg')
                      exact = (m.group('ver') or '').strip() or None
                      depver = find_binary_version(dep, srcver, exact)
                      if depver:
                          queue.append((dep, depver))

              for cc in sorted(compilers):
                  sh(['apt-get', 'install', '-y', '--no-install-recommends', cc])

              hdr = f'/usr/src/linux-headers-{kver}'
              if not os.path.isdir(hdr):
                  raise RuntimeError(f'抽取后仍未找到 {hdr}')

              os.makedirs(f'/lib/modules/{kver}', exist_ok=True)
              for link in ('build', 'source'):
                  p = f'/lib/modules/{kver}/{link}'
                  if os.path.lexists(p):
                      os.unlink(p)
                  os.symlink(hdr, p)

          def zfs_version():
              dirs = []
              for name in os.listdir('/usr/src'):
                  if name.startswith('zfs-') and os.path.isdir('/usr/src/' + name):
                      dirs.append(name[4:])
              if not dirs:
                  raise RuntimeError('找不到 /usr/src/zfs-*')
              best = dirs[0]
              for v in dirs[1:]:
                  if sh(['dpkg', '--compare-versions', v, 'gt', best]).returncode == 0:
                      best = v
              return best

          def build_one(kver, header_binver, srcver, zver):
              print('\n' + '=' * 68, flush=True)
              print(f'>>> {kver}  header={header_binver}  source={srcver}', flush=True)

              if released(kver):
                  print('✓ Release 已存在，跳过', flush=True)
                  return

              try:
                  extract_header_tree(kver, header_binver, srcver)
              except Exception as e:
                  print(f'[-] headers 准备失败: {e}', flush=True)
                  return

              sh(['dkms', 'remove', f'zfs/{zver}', '-k', kver])
              rc = sh(['dkms', 'build', f'zfs/{zver}', '-k', kver]).returncode
              if rc != 0:
                  print(f'[-] DKMS 编译失败: {kver}', flush=True)
                  log = f'/var/lib/dkms/zfs/{zver}/build/make.log'
                  if os.path.isfile(log):
                      with open(log, errors='ignore') as f:
                          print(''.join(f.readlines()[-80:]), flush=True)
                  return

              cmd = f'''find /lib/modules/{kver} /var/lib/dkms/zfs/{zver}/{kver} -type f -name "zfs.ko*" 2>/dev/null | head -n1'''
              p = subprocess.run(cmd, shell=True, text=True, stdout=subprocess.PIPE)
              zfsko = p.stdout.strip()
              if not zfsko:
                  print(f'[-] 未找到 zfs.ko: {kver}', flush=True)
                  return
              moddir = os.path.dirname(zfsko)

              root = f'/tmp/zfs-pack-{kver}'
              pkgdir = f'{root}/zfs-modules-{kver}'
              shutil.rmtree(root, ignore_errors=True)
              os.makedirs(f'{pkgdir}/modules', exist_ok=True)

              for name in os.listdir(moddir):
                  if '.ko' in name:
                      src = os.path.join(moddir, name)
                      if os.path.isfile(src):
                          shutil.copy2(src, f'{pkgdir}/modules/{name}')

              with open(f'{pkgdir}/metadata.txt', 'w') as f:
                  f.write(f'kernel_version={kver}\n')
                  f.write('module_path=updates/dkms\n')
                  f.write(f'zfs_version={zver}\n')
                  f.write(f'debian_version={target}\n')
                  f.write('source=snapshot.debian.org\n')

              out = f'/work/output/zfs-modules-{kver}.tar.gz'
              sh(['tar', '-czf', out, '-C', root, f'zfs-modules-{kver}'], check=True)
              print(f'✓ 生成 {out}', flush=True)

              shutil.rmtree(root, ignore_errors=True)
              shutil.rmtree(f'/var/lib/dkms/zfs/{zver}/{kver}', ignore_errors=True)

          if not os.path.isfile(manifest):
              raise RuntimeError(f'历史清单不存在: {manifest}')

          with open(manifest) as f:
              rows = json.load(f)

          suffix = '-' + flavor
          rows = [r for r in rows if r['kver'].endswith(suffix)]
          print(f'Debian {target} / {flavor}: 清单中 {len(rows)} 个内核', flush=True)

          zver = zfs_version()
          print(f'ZFS DKMS: {zver}', flush=True)
          for r in rows:
              build_one(r['kver'], r['binver'], r['srcver'], zver)
          PY
          CONTAINER

      - name: 上传历史模块到 Release
        uses: softprops/action-gh-release@v3
        if: always()
        with:
          tag_name: debian-ZFS
          name: Debian ZFS Prebuilt Modules
          files: output/zfs-modules-*.tar.gz
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
